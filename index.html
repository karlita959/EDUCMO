<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Control Escolar: Ingreso</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header><strong>Control Escolar</strong></header>
  <main>
    <div class="card auth">
      <div id="aviso-pendiente" class="msg-error" style="display:none; margin-bottom:12px;">
        Tu cuenta de docente está pendiente de aprobación por el administrador.
      </div>
      <div class="tabs">
        <button class="secundario" id="tab-login" type="button">Iniciar sesión</button>
        <button class="secundario" id="tab-registro" type="button">Registrarme</button>
      </div>

      <form id="form-login" style="display:none">
        <h2>Iniciar sesión</h2>
        <label>Correo <input name="email" type="email" required /></label>
        <label>Contraseña <input name="password" type="password" required minlength="6" /></label>
        <button class="primario" type="submit">Entrar</button>
        <p id="msg-login"></p>
      </form>

      <form id="form-registro" style="display:none">
        <h2>Crear cuenta</h2>
        <label>Tipo de cuenta
          <select name="rol" id="rol-registro">
            <option value="alumno">Alumno</option>
            <option value="docente">Docente</option>
          </select>
        </label>
        <label>Nombre completo <input name="nombre" required /></label>
        <label>Correo <input name="email" type="email" required /></label>
        <label>Contraseña (mínimo 6) <input name="password" type="password" required minlength="6" /></label>
        <label id="campo-matricula">Matrícula (alumnos) <input name="matricula" /></label>
        <button class="primario" type="submit">Registrarme</button>
        <p id="msg-registro"></p>
      </form>
    </div>
  </main>
  <div id="toast" class="toast"></div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
